<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10264b"><title>كنوز | KENOZ</title>
<style>
:root{--navy:#10264b;--gold:#c8a64b;--paper:#f7f5ef;--ink:#172033}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}header{background:var(--navy);color:white;padding:22px 18px 18px;border-bottom:4px solid var(--gold)}header h1{margin:0;font-size:27px}header p{margin:3px 0 0;color:#e5d7ad;font-size:13px}.wrap{max-width:900px;margin:auto;padding:14px}.search{width:100%;padding:13px;border:1px solid #d8d4c8;border-radius:12px;font-size:16px;background:white;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.tile,.item{background:white;border:1px solid #e5e0d3;border-radius:14px;padding:14px;cursor:pointer;text-align:right;box-shadow:0 2px 8px #10264b0a}.tile strong{display:block;font-size:16px}.tile small{color:#697386}.bar{display:flex;gap:8px;align-items:center;margin:10px 0}.btn{background:var(--navy);color:white;border:0;border-radius:10px;padding:11px 14px;font-size:14px;cursor:pointer}.btn.alt{background:#eee8d8;color:var(--navy)}.hidden{display:none!important}.muted{color:#687083;font-size:13px}.list{display:grid;gap:8px}.reader{white-space:pre-wrap;background:white;border-radius:14px;padding:20px;font-size:18px;line-height:2.05;border:1px solid #e5e0d3;overflow-wrap:anywhere}.status{padding:12px;background:#fff8df;border-radius:10px;font-size:13px;margin:10px 0}.back{background:transparent;color:var(--navy);border:1px solid #c9c4b8}.footer{text-align:center;color:#777;font-size:12px;padding:22px}
</style></head><body><header><h1>✝ كنوز | KENOZ</h1><p>مكتبة كنسية — قراءة منظمة وإمكانية العمل دون اتصال بعد حفظ المحتوى</p></header><main class="wrap"><div class="bar"><button class="btn back hidden" id="back">→ رجوع</button><strong id="heading">الأقسام</strong><span style="flex:1"></span><button class="btn alt" id="installHelp">التثبيت</button></div><input class="search" id="search" placeholder="ابحث في النصوص..." autocomplete="off"><div id="status" class="status">يتم تحميل فهرس المحتوى المحلي…</div><section id="home" class="grid"></section><section id="items" class="list hidden"></section><article id="reader" class="reader hidden"></article><div class="footer">كنوز — الأقسام التي لا توجد ملفات JSON لها لن تعرض النصوص حتى تضاف ملفاتها.</div></main>
<script>
const cats=[['bible','الكتاب المقدس','assets/content/bible.json'],['agpeya','الأجبية','assets/content/agpeya.json'],['kholagy','الخولاجي','assets/content/kholagy.json'],['katamars','القطمارس','assets/content/katamars.json'],['synaxarium','السنكسار','assets/content/synaxarium.json'],['psalmody_annual','التسبحة السنوية','assets/content/psalmody_annual.json'],['absalmody','الإبصلمودية','assets/content/absalmody.json'],['prostrations','صلوات السجود','assets/content/prostrations.json'],['dallal','الدلال','assets/content/dallal.json'],['shawahed','الشواهد','assets/content/shawahed.json']];
const $=id=>document.getElementById(id);let data={},current=null;
function norm(x){return String(x??'').toLocaleLowerCase('ar').trim()}function titleOf(x){return x.title||x.name||x.heading||x.path?.split('/').pop()||'نص كنسي'}function bodyOf(x){if(x.text)return String(x.text);if(x.content)return typeof x.content==='string'?x.content:JSON.stringify(x.content,null,2);if(Array.isArray(x.rows))return x.rows.map(r=>Array.isArray(r)?r.filter(v=>String(v??'').trim()).join('\n'):String(r)).join('\n\n');return ''}
function showHome(){current=null;$('heading').textContent='الأقسام';$('back').classList.add('hidden');$('home').classList.remove('hidden');$('items').classList.add('hidden');$('reader').classList.add('hidden');$('search').value='';renderCats()}
function renderCats(){const q=norm($('search').value);$('home').innerHTML='';cats.filter(c=>norm(c[1]).includes(q)).forEach(c=>{const arr=data[c[0]]?.items||data[c[0]]||[];const b=document.createElement('button');b.className='tile';const t=document.createElement('strong');t.textContent=c[1];const small=document.createElement('small');small.textContent=arr.length+' عنصر محمّل';b.append(t,small);b.onclick=()=>openCat(c);$('home').append(b)})}
function openCat(c){current=c;$('heading').textContent=c[1];$('back').classList.remove('hidden');$('home').classList.add('hidden');$('reader').classList.add('hidden');$('items').classList.remove('hidden');$('search').value='';renderItems()}
function renderItems(){if(!current)return;const arr=data[current[0]]?.items||data[current[0]]||[];const q=norm($('search').value);$('items').innerHTML='';arr.forEach(it=>{const t=titleOf(it),body=bodyOf(it);if(q&&!norm(t+' '+body).includes(q))return;const b=document.createElement('button');b.className='item';const strong=document.createElement('strong');strong.textContent=t;b.append(strong);const small=document.createElement('div');small.className='muted';small.textContent=body.slice(0,130);b.append(small);b.onclick=()=>openText(it,t);$('items').append(b)});if(!$('items').children.length)$('items').textContent='لا توجد نتائج أو لم تتم إضافة ملف JSON لهذا القسم.'}
function openText(it,t){$('items').classList.add('hidden');$('home').classList.add('hidden');$('reader').classList.remove('hidden');$('heading').textContent=t;$('reader').textContent=bodyOf(it)||'لا يوجد نص قابل للعرض لهذا العنصر.'}
$('back').onclick=()=>{if(!$('reader').classList.contains('hidden')){$('reader').classList.add('hidden');$('items').classList.remove('hidden');$('heading').textContent=current?.[1]||'الأقسام'}else showHome()};$('search').addEventListener('input',()=>current?renderItems():renderCats());$('installHelp').onclick=()=>alert('من قائمة المتصفح اختر إضافة إلى الشاشة الرئيسية. يلزم HTTPS لتثبيت نسخة الويب كتطبيق.');
async function boot(){let ok=0;for(const c of cats){try{const r=await fetch(c[2]);if(r.ok){data[c[0]]=await r.json();ok++}}catch(e){}}$('status').textContent=ok?'تم تحميل بيانات '+ok+' أقسام. بقية الأقسام تحتاج ملفات JSON.':'واجهة HTML جاهزة، لكن ملفات JSON للمحتوى لم تُنشر كلها داخل الموقع بعد.';renderCats();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}boot();
</script></body></html>
