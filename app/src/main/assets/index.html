<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2b46">
<title>كنوز | KENOZ</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-logo">✝</div>
  <div class="boot-title">كنوز</div>
  <div class="boot-sub">مكتبة الكنيسة القبطية الأرثوذكسية</div>
  <div class="spinner"></div>
  <div class="boot-msg" id="bootMsg">جارٍ تحميل المكتبة…</div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <button class="iconbtn back hidden" id="btnBack" aria-label="رجوع">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="brand">
      <span class="cross">✝</span>
      <span id="barTitle">كنوز</span>
    </div>
    <button class="iconbtn" id="btnSearch" aria-label="بحث">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottomnav" id="bottomnav">
    <button data-nav="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span></button>
    <button data-nav="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>بحث</span></button>
    <button data-nav="bookmarks"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>محفوظاتي</span></button>
    <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg><span>الإعدادات</span></button>
  </nav>
</div>

<div class="sheet-wrap hidden" id="sheetWrap">
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <strong id="sheetTitle"></strong>
      <button class="iconbtn" id="sheetClose" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
