name: Publish unified KENOZ corpus

on:
  push:
    branches:
      - main
    paths:
      - 'data/corpus-publish/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the uploaded corpus parts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin corpus-upload-staging
          git checkout origin/corpus-upload-staging -- data/unified-corpus-parts/part_*.txt
          test -n "$(ls data/unified-corpus-parts/part_*.txt 2>/dev/null)"
          cat data/unified-corpus-parts/part_*.txt > KENOZ_All_Extracted_Texts_Unified.txt
          bytes="$(wc -c < KENOZ_All_Extracted_Texts_Unified.txt)"
          lines="$(wc -l < KENOZ_All_Extracted_Texts_Unified.txt)"
          echo "Assembled $bytes bytes and $lines lines"
          test "$bytes" -gt 60000000
          rm -rf data/unified-corpus-parts
          git add KENOZ_All_Extracted_Texts_Unified.txt
          git add -A data/unified-corpus-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add unified extracted KENOZ text corpus"
          git push origin HEAD:main
