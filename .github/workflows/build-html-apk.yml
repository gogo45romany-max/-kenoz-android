name: Build KENOZ Offline HTML APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "scripts/**"
      - "KENOZ_All_Extracted_Texts_Unified.zip"
      - ".github/workflows/build-html-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare the full offline text library
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kenoz"
          unzip -p KENOZ_All_Extracted_Texts_Unified.zip KENOZ_All_Extracted_Texts_Unified.txt > "$RUNNER_TEMP/kenoz/master.txt"
          test "$(wc -c < "$RUNNER_TEMP/kenoz/master.txt")" -gt 60000000
          python3 scripts/prepare_corpus.py --input "$RUNNER_TEMP/kenoz/master.txt" --output web/assets/corpus
          test -s web/assets/corpus/manifest.json
          test -s web/assets/corpus/chunk-0001.jsonl
          test -s web/assets/corpus/indexes/by-title.json
          test -s web/assets/corpus/indexes/by-source.json
          test -s web/assets/corpus/indexes/by-category.json
          test -s web/assets/corpus/indexes/review-index.json
          test -s web/assets/corpus/indexes/quality-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("web/assets/corpus")
          manifest = json.loads((base / "manifest.json").read_text(encoding="utf-8"))
          title_index = json.loads((base / "indexes/by-title.json").read_text(encoding="utf-8"))
          source_index = json.loads((base / "indexes/by-source.json").read_text(encoding="utf-8"))
          category_index = json.loads((base / "indexes/by-category.json").read_text(encoding="utf-8"))
          review_index = json.loads((base / "indexes/review-index.json").read_text(encoding="utf-8"))
          report = json.loads((base / "indexes/quality-report.json").read_text(encoding="utf-8"))
          expected = manifest["documentCount"]
          assert len(title_index) == expected, (len(title_index), expected)
          assert len(source_index) == expected, (len(source_index), expected)
          assert sum(c["count"] for c in category_index["categories"]) == expected
          assert len({x["id"] for x in title_index}) == expected
          assert report["summary"]["structuralChecksPassed"] is True
          assert len(review_index) == report["summary"]["documentsWithFlags"]
          print("Index validation passed:", expected, "documents;", len(review_index), "review flags")
          print(json.dumps(report["summary"], ensure_ascii=False))
          PY
          cat web/assets/corpus/REPORT.txt
          du -sh web/assets/corpus
      - name: Install Cordova
        run: npm install --global cordova
      - name: Create Android wrapper and build the offline APK
        run: |
          set -euo pipefail
          cordova create kenoz-wrapper com.kenoz.app KENOZ
          cd kenoz-wrapper
          cordova platform add android@14.0.1
          rm -rf www/*
          cp -R "$GITHUB_WORKSPACE/web/." www/
          test -f www/index.html
          test -s www/assets/corpus/manifest.json
          cordova build android --debug
      - name: Record APK size
        run: |
          APK="kenoz-wrapper/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: KENOZ-Offline-APK-All-Texts
          path: kenoz-wrapper/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
