name: Build KENOZ HTML APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/build-html-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Cordova
        run: npm install --global cordova
      - name: Create Android wrapper for the HTML app
        run: |
          cordova create kenoz-wrapper com.kenoz.app KENOZ
          cd kenoz-wrapper
          cordova platform add android@14.0.1
          rm -rf www/*
          cp -R "$GITHUB_WORKSPACE/web/." www/
          test -f www/index.html
          cordova build android --debug
      - name: Upload HTML-based APK
        uses: actions/upload-artifact@v4
        with:
          name: KENOZ-HTML-APK
          path: kenoz-wrapper/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
