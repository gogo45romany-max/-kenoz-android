name: Build Kenoz APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download Arabic Bible dataset
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/midvash/bible-data/main/versions/ar/svd/svd.json -o app/src/main/assets/bible-data.json
          python3 - <<'PY'
          import json
          with open('app/src/main/assets/bible-data.json', encoding='utf-8') as f: d=json.load(f)
          if len(d.get('books', [])) != 66: raise SystemExit('Unexpected Bible dataset')
          print('Validated', len(d['books']), 'books')
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kenoz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk