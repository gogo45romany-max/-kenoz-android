name: Build Kenoz Flutter APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download Arabic Bible dataset
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/midvash/bible-data/main/versions/ar/svd/svd.json -o assets/bible-data.json
          python3 - <<'PY'
          import json
          with open('assets/bible-data.json', encoding='utf-8') as f:
              d = json.load(f)
          books = d.get('books', [])
          if len(books) != 66:
              raise SystemExit(f'Unexpected Bible dataset: {len(books)} books')
          print(f'Validated {len(books)} books')
          PY
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.kenoz --project-name kenoz .
      - name: Force Android compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          found = False
          for p in paths:
              if not p.exists():
                  continue
              found = True
              text = p.read_text()
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if re.search(r'\bcompileSdk\b|\bcompileSdkVersion\b', line):
                      indent = line[:len(line) - len(line.lstrip())]
                      if p.suffix == '.kts':
                          lines[i] = indent + 'compileSdk = 36'
                      else:
                          lines[i] = indent + 'compileSdkVersion 36'
              p.write_text('\n'.join(lines) + '\n')
              print('Updated', p)
              print('\n'.join(x for x in lines if 'compileSdk' in x))
          if not found:
              raise SystemExit('Android app Gradle file not found')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Patch plugin compile SDK metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          changed = []
          if root.exists():
              for p in root.glob('*/android/build.gradle*'):
                  try:
                      s = p.read_text()
                  except Exception:
                      continue
                  new = re.sub(r'compileSdkVersion\s+34\b', 'compileSdkVersion 36', s)
                  new = re.sub(r'compileSdk\s*=\s*34\b', 'compileSdk = 36', new)
                  if new != s:
                      p.write_text(new)
                      changed.append(str(p))
          print('Patched plugin Gradle files:', changed)
          PY
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Analyze Flutter project (report only while migration stabilizes)
        run: flutter analyze || true
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kenoz-Flutter-debug-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
