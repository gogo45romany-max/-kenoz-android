name: Build KENOZ APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "keystore/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify offline library
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/app.js
          test -f app/src/main/assets/content/catalog.json
          python3 - <<'PY'
          import json, os
          cat = json.load(open('app/src/main/assets/content/catalog.json', encoding='utf-8'))
          assert cat['sections'], 'empty catalog'
          docs = cat['docs']
          assert docs > 2500, f'unexpected document count: {docs}'
          missing = []
          for sec in cat['sections']:
              idx = json.load(open(f"app/src/main/assets/content/{sec['index']}", encoding='utf-8'))
              for g in idx['groups']:
                  for d in g['docs']:
                      p = f"app/src/main/assets/content/{sec['id']}/{d['f']}"
                      if not os.path.exists(p):
                          missing.append(p)
          assert not missing, f'missing files: {missing[:5]}'
          print(f"OK — {docs} documents across {len(cat['sections'])} sections")
          PY

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify signature and size
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" KENOZ-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENOZ-APK
          path: KENOZ-1.0.0.apk
          if-no-files-found: error

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            app/build/outputs/logs/**
          if-no-files-found: ignore
