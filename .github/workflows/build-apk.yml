name: Build Kenoz Flutter APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download Arabic Bible dataset
        run: |
          curl -fL --retry 3 https://raw.githubusercontent.com/midvash/bible-data/main/versions/ar/svd/svd.json -o assets/bible-data.json
          python3 - <<'PY'
          import json
          with open('assets/bible-data.json', encoding='utf-8') as f:
              d = json.load(f)
          books = d.get('books', [])
          if len(books) != 66:
              raise SystemExit(f'Unexpected Bible dataset: {len(books)} books')
          print(f'Validated {len(books)} books')
          PY
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.kenoz --project-name kenoz .
      - name: Force Android compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text()
              text = text.replace('flutter.compileSdkVersion', '36')
              text = text.replace('compileSdkVersion 34', 'compileSdkVersion 36')
              text = text.replace('compileSdkVersion = 34', 'compileSdkVersion = 36')
              p.write_text(text)
              print(name, [line.strip() for line in text.splitlines() if 'compileSdk' in line])
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Analyze Flutter project (report only while migration stabilizes)
        run: flutter analyze || true
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kenoz-Flutter-debug-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
